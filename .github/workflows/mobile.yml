name: Mobile apps

# Checks that the iOS and Android apps still build. Run it by hand (Actions tab → Mobile apps → Run workflow)
# to get an installable Android APK, plus a signed Google Play bundle once the signing secrets exist
# (see docs/MOBILE.md).
on:
  pull_request:
    paths: ['android/**', 'ios/**', 'capacitor.config.json', 'package.json', 'package-lock.json', '.github/workflows/mobile.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      HAS_SIGNING_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: npm ci
      - run: npm run build:mobile

      - name: Build test APK
        working-directory: android
        run: ./gradlew assembleDebug

      - uses: actions/upload-artifact@v5
        with:
          name: fretboard-practice-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk

      - name: Build signed Google Play bundle
        if: github.event_name == 'workflow_dispatch' && env.HAS_SIGNING_KEY == 'true'
        working-directory: android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > upload.jks
          ANDROID_KEYSTORE_PATH=upload.jks ./gradlew bundleRelease
          rm upload.jks

      - uses: actions/upload-artifact@v5
        if: github.event_name == 'workflow_dispatch'
        with:
          name: fretboard-practice-play-bundle
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: ignore

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:mobile
      - name: Build for the iOS simulator (no signing needed)
        run: >
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug
          -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
