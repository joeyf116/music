name: Mobile apps

# Builds the native iOS and Android apps in mobile/ to check they still compile. Each run uploads an Android APK
# you can install on a phone straight away (Actions → Mobile apps → the run → Artifacts).
# Store builds are made with EAS instead (see mobile/README.md).
on:
  pull_request:
    paths: ['mobile/**', 'src/lib/**', '.github/workflows/mobile.yml']
  push:
    branches: [main]
    paths: ['mobile/**', 'src/lib/**', '.github/workflows/mobile.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: mobile

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - name: Bundle the JavaScript for both platforms
        run: npx expo export --platform ios --platform android --output-dir /tmp/expo-export

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - run: npx expo prebuild --platform android --no-install
      - name: Build an installable APK (signed with the debug key, not for the store)
        working-directory: mobile/android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a
      - uses: actions/upload-artifact@v5
        with:
          name: fretboard-practice-android-apk
          path: mobile/android/app/build/outputs/apk/release/*.apk

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npx expo prebuild --platform ios
      - name: Build for the iOS simulator (no signing needed)
        working-directory: mobile/ios
        run: >
          xcodebuild -workspace FretboardPractice.xcworkspace -scheme FretboardPractice -configuration Release
          -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO -quiet build
